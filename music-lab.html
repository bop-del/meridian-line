<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
  <title>MERIDIAN LINE music lab</title>
  <style>
    body { margin: 0; padding: 32px; background: #070b14; color: #dbe7ff; font: 15px/1.5 system-ui, sans-serif; }
    h1 { font-size: 22px; margin: 0 0 4px; letter-spacing: .08em; }
    p.sub { margin: 0 0 20px; color: #7f93b8; max-width: 820px; }
    .tools { display: flex; align-items: center; flex-wrap: wrap; gap: 14px; margin: 14px 0; max-width: 900px; }
    .tools label { display: flex; align-items: center; gap: 8px; }
    select, button { font: inherit; padding: 7px 12px; border-radius: 6px; border: 1px solid #2b4570; background: #12203a; color: #dbe7ff; cursor: pointer; }
    button:hover { background: #1a2d52; } button.pri { background: #0c6f8f; border-color: #35d0ff; }
    button:disabled, input:disabled { opacity: .4; cursor: default; }
    .row { display: flex; align-items: center; gap: 14px; padding: 12px 16px; margin: 8px 0; max-width: 900px; background: #0d1526; border: 1px solid #1c2b48; border-radius: 8px; }
    .row.active { border-color: #35d0ff; box-shadow: 0 0 0 1px #35d0ff33; }
    .row .txt { flex: 1; min-width: 0; } .row b { display: block; } .row small { color: #7f93b8; display: block; }
    .badge { display: inline-block; padding: 1px 8px; border-radius: 10px; font-size: 12px; margin-left: 6px; background: #12203a; border: 1px solid #2b4570; color: #9fb4d8; }
    .badge.ok { border-color: #2f8f5a; color: #8fe3a8; } .badge.legacy { border-color: #8f6a2f; color: #e3c48f; }
    .live { color: #35d0ff; font-variant-numeric: tabular-nums; }
    #status { color: #8fe3a8; min-height: 1.4em; max-width: 900px; }
  </style>
</head>
<body>
  <h1>MUSIC LAB</h1>
  <p class="sub">Audition every track of every style. A track a style has not delivered yet falls back to the old song and is marked legacy. "Use this style in the game" saves your choice for this browser (localStorage), then open the game.</p>
  <div class="tools">
    <label>Style <select id="style"></select></label>
    <button id="use" class="pri">Use this style in the game</button>
    <label>Volume <input id="vol" type="range" min="0" max="1" step="0.01" value="0.7" /></label>
    <button id="stop">Stop</button>
    <a href="./sfx-lab.html" style="color:#35d0ff">Sound lab</a>
    <a href="./" style="color:#35d0ff">Open the game</a>
  </div>
  <div class="tools">
    <label>Intensity <input id="int" type="range" min="0" max="1" step="0.01" value="0.6" disabled /> <span id="intval" class="live">0.60</span></label>
    <span id="intnote" style="color:#7f93b8"></span>
  </div>
  <div id="list"></div>
  <p id="status"></p>
  <script type="module" src="/src/audio/title/lab.js"></script>
</body>
</html>
